# 1) Secret with tokens + every MDS switch (keeps passwords out of Git):
#      oc create secret generic mds-mcp-env --from-env-file=.env
# 2) Set the image below, then: oc apply -f openshift.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mds-mcp
  labels: {app: mds-mcp}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mds-mcp}
  template:
    metadata:
      labels: {app: mds-mcp}
    spec:
      containers:
      - name: mds-mcp
        image: <registry>/mds-mcp:2.0
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - secretRef:
            name: mds-mcp-env
        readinessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mds-mcp
spec:
  selector: {app: mds-mcp}
  ports:
  - name: http
    port: 8000
    targetPort: 8000
